name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devflow?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/devflow?schema=public
      JWT_SECRET: devflow_super_secret_test_key_for_ci_12345
      ENCRYPTION_KEY: devflow-default-encryption-secret-key-32b
      GITHUB_WEBHOOK_SECRET: devflow-webhook-secret

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Type Check
        run: pnpm run typecheck

      - name: Build Application
        run: pnpm run build

      - name: Initialize Database
        run: |
          pnpm run db:push
          pnpm run db:seed:all

      - name: Start Services
        run: |
          pnpm run dev &
          npx wait-on http://localhost:4000/api/health http://localhost:3000
        env:
          NODE_ENV: test
          PORT: 4000
          WEB_PORT: 3000
          API_URL: http://localhost:4000
          WEB_URL: http://localhost:3000

      - name: Run E2E Tests
        run: pnpm test
        env:
          API_URL: http://localhost:4000
          WEB_URL: http://localhost:3000
