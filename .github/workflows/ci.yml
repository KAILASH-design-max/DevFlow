name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Type Check
        run: pnpm run typecheck

      - name: Build Application
        run: pnpm run build

      - name: Initialize Database
        run: |
          pnpm run db:push
          pnpm run db:seed:all

      - name: Start Services
        run: |
          pnpm run dev &
          npx wait-on http://localhost:4000/api/health http://localhost:3000
        env:
          NODE_ENV: test
          PORT: 4000
          WEB_PORT: 3000
          API_URL: http://localhost:4000
          WEB_URL: http://localhost:3000

      - name: Run E2E Tests
        run: pnpm test
        env:
          API_URL: http://localhost:4000
          WEB_URL: http://localhost:3000
